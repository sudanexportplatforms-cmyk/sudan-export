kind = "web"
previewPath = "/"
title = "Sudan Export"
version = "1.0.0"
id = "artifacts/sudan-export"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25094

[services.development]
run = "pnpm --filter @workspace/sudan-export run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sudan-export", "run", "build" ]
publicDir = "artifacts/sudan-export/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25094"
BASE_PATH = "/"
